<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gold price today</title>
  <link rel="icon" href="data:,">
  <!-- "Cinema" TV design: the shop's photos fill the screen with slow camera moves; prices float over them in glass cards. -->
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #fff; cursor: none; }
    .serif { font-family: Cinzel, Constantia, 'Palatino Linotype', 'Book Antiqua', Georgia, serif; }
    .hide { display: none !important; }

    /* ----- the picture, moving like a slow camera ----- */
    .bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; background: #0a0703; }
    .slide { position: absolute; top: -6%; left: -6%; width: 112%; height: 112%; background-size: cover; background-position: center; opacity: 0; transition: opacity 2.2s ease; }
    .slide.on { opacity: 1; }
    .slide.on.a { animation: panA 18s linear both; }
    .slide.on.b { animation: panB 18s linear both; }
    .slide.out { opacity: 0; transform: scale(1.08); }
    @keyframes panA { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.12) translate(-2.5%, -1.5%); } }
    @keyframes panB { from { transform: scale(1.12) translate(2%, 1.5%); } to { transform: scale(1) translate(0, 0); } }
    /* shown until the shop adds pictures: slow golden silk */
    .silk { position: absolute; top: -20%; left: -20%; width: 140%; height: 140%; opacity: 0;
      background: radial-gradient(ellipse at 30% 40%, #5a3f0f 0%, rgba(90, 63, 15, 0) 45%), radial-gradient(ellipse at 70% 65%, #3a2a0a 0%, rgba(58, 42, 10, 0) 50%), linear-gradient(135deg, #1a1205, #050302 60%, #15100a);
      animation: silk 30s ease-in-out infinite alternate; }
    body.noimg .silk { opacity: 1; }
    @keyframes silk { from { transform: translate(0, 0) rotate(0deg); } to { transform: translate(-6%, 4%) rotate(6deg); } }
    .shade { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(90deg, rgba(0, 0, 0, .78) 0%, rgba(0, 0, 0, .45) 40%, rgba(0, 0, 0, .05) 75%), linear-gradient(180deg, rgba(0, 0, 0, .55) 0%, rgba(0, 0, 0, 0) 25%, rgba(0, 0, 0, 0) 60%, rgba(0, 0, 0, .8) 100%); }
    .leak { position: absolute; width: 60vw; height: 60vw; border-radius: 50%; top: -20vw; right: -15vw; background: radial-gradient(circle, rgba(255, 214, 120, .35), rgba(255, 214, 120, 0) 60%); mix-blend-mode: screen; animation: leak 14s ease-in-out infinite alternate; }
    @keyframes leak { from { transform: translate(0, 0) scale(1); opacity: .7; } to { transform: translate(-25vw, 30vh) scale(1.25); opacity: 1; } }

    .screen { position: relative; height: 100vh; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; padding: 3.2vh 3.4vw 2.4vh; }
    header { display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between; -webkit-align-items: flex-start; align-items: flex-start; animation: fadedown 1.2s ease both; }
    h1 { margin: 0; font-size: 7vh; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; line-height: 1; color: #f6dc8d; text-shadow: 0 .4vh 2.4vh rgba(0, 0, 0, .7); }
    .sub { margin: 1vh 0 0; font-size: 2.8vh; letter-spacing: .3em; text-transform: uppercase; color: #e9c35a; }
    .sub:before { content: ''; display: inline-block; width: 4vw; height: .25vh; background: #e9c35a; vertical-align: middle; margin-right: 1vw; }
    .time { text-align: right; line-height: 1; }
    .time b { display: block; font-size: 7.4vh; font-weight: 300; letter-spacing: .04em; white-space: nowrap; }
    .time b small { font-size: 2.6vh; font-weight: 600; margin-left: .5vw; color: #e9c35a; }
    .time span { display: block; margin-top: .8vh; font-size: 2.5vh; color: #d9cfb3; letter-spacing: .1em; }

    main { -webkit-flex: 1; flex: 1; display: -webkit-flex; display: flex; -webkit-align-items: flex-end; align-items: flex-end; -webkit-justify-content: space-between; justify-content: space-between; min-height: 0; padding-bottom: 2vh; }
    .cards { display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; width: 38vw; }
    .unit { font-size: 2.4vh; letter-spacing: .25em; text-transform: uppercase; color: #e9c35a; margin-bottom: 1.4vh; animation: fadedown 1s ease .6s both; }
    .card { position: relative; overflow: hidden; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; margin-bottom: 1.3vh; padding: 1.2vh 1.6vw 1.2vh 1.3vw;
      background: rgba(10, 8, 4, .55); border: 1px solid rgba(255, 255, 255, .18); border-left: .7vh solid #e9c35a; border-radius: 1.2vh;
      -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); box-shadow: 0 1.5vh 4vh rgba(0, 0, 0, .45); animation: fromleft .9s cubic-bezier(.2, .8, .2, 1) both; transition: background-color .6s, border-color .6s, transform .6s; }
    .card:nth-child(2) { animation-delay: .5s; }
    .card:nth-child(3) { animation-delay: .65s; }
    .card:nth-child(4) { animation-delay: .8s; }
    .card:nth-child(5) { animation-delay: .95s; }
    .card.lit { background: rgba(120, 88, 20, .55); border-color: #f6dc8d; transform: translateX(1.2vw); }
    .card .k { width: 9vw; font-size: 6.2vh; font-weight: 800; line-height: 1; color: #f6dc8d; }
    .card .k small { display: block; font-size: 2vh; letter-spacing: .5vh; font-weight: 600; color: #d9cfb3; margin-top: .4vh; padding-left: .4vh; }
    .card .p { -webkit-flex: 1; flex: 1; text-align: right; font-size: 6.4vh; font-weight: 700; line-height: 1; white-space: nowrap; }
    .card .p i { font-style: normal; font-size: .5em; font-weight: 600; margin-right: .5vw; color: #e9c35a; }
    .card .b { text-align: right; font-size: 2.4vh; color: #d9cfb3; margin-top: .5vh; }
    .card:after { content: ''; position: absolute; top: 0; bottom: 0; left: -40%; width: 30%; background: linear-gradient(90deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, .25), rgba(255, 255, 255, 0)); transform: skewX(-20deg); animation: sheen 7s ease-in-out infinite; }
    .card:nth-child(3):after { animation-delay: 1.2s; }
    .card:nth-child(4):after { animation-delay: 2.4s; }
    .card:nth-child(5):after { animation-delay: 3.6s; }
    @keyframes sheen { 0%, 70% { left: -40%; } 100% { left: 130%; } }

    .side { width: 34vw; text-align: right; animation: fadeup 1.1s ease .9s both; }
    .points { list-style: none; margin: 0 0 1.6vh; padding: 0; }
    .points li { display: inline-block; margin: 0 0 1vh 1vw; padding: .9vh 1.4vw; border: 1px solid rgba(246, 220, 141, .6); border-radius: 99vh; background: rgba(0, 0, 0, .45); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 2.3vh; letter-spacing: .06em; text-transform: uppercase; }
    .points li b { color: #f6dc8d; margin-right: .6vw; }
    .contact { font-size: 5vh; font-weight: 800; color: #fff; letter-spacing: .04em; text-shadow: 0 .3vh 1.6vh rgba(0, 0, 0, .8); }
    .contact small { display: block; font-size: 2.3vh; font-weight: 600; letter-spacing: .3em; text-transform: uppercase; color: #e9c35a; }

    footer { -webkit-flex: none; flex: none; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; height: 6.4vh; border-radius: 1vh; overflow: hidden;
      background: rgba(0, 0, 0, .55); border: 1px solid rgba(255, 255, 255, .15); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); animation: fadeup 1s ease 1.2s both; }
    footer .tag { -webkit-flex: none; flex: none; height: 100%; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; padding: 0 1.6vw; background: #e9c35a; color: #140d00; font-weight: 800; font-size: 2.6vh; letter-spacing: .2em; text-transform: uppercase; }
    .run { -webkit-flex: 1; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; font-size: 3.2vh; font-weight: 600; }
    .run div { display: inline-block; }
    .run span { display: inline-block; white-space: pre; }
    @keyframes tvmarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }

    .emblem { position: absolute; right: 8vw; top: 24vh; width: 34vh; height: 34vh; opacity: 0; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; }
    body.noimg .emblem { opacity: 1; }
    .emblem i { position: absolute; top: 0; left: 0; right: 0; bottom: 0; border: .25vh solid #e9c35a; border-radius: 50%; opacity: 0; animation: ring 5s ease-out infinite; }
    .emblem i + i { animation-delay: 1.7s; }
    .emblem i + i + i { animation-delay: 3.4s; }
    .emblem svg { width: 20vh; height: 17vh; animation: gem 5s ease-in-out infinite; }
    @keyframes ring { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(1.3); opacity: 0; } }
    @keyframes gem { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 .6vh rgba(246, 220, 141, .5)); } 50% { transform: scale(1.07); filter: drop-shadow(0 0 2vh rgba(255, 243, 196, 1)); } }

    @keyframes fadedown { from { opacity: 0; transform: translateY(-3vh); } to { opacity: 1; transform: none; } }
    @keyframes fadeup { from { opacity: 0; transform: translateY(3vh); } to { opacity: 1; transform: none; } }
    @keyframes fromleft { from { opacity: 0; transform: translateX(-6vw); } to { opacity: 1; transform: none; } }
    .offline { position: fixed; right: 1vw; top: 1vh; font-size: 1.8vh; color: #c9b98a; display: none; }
    @media (prefers-reduced-motion: reduce) { *, *:before, *:after { animation: none !important; transition: none !important; } .slide.on { opacity: 1; } }
  </style>
</head>
<body class="noimg">
  <div class="bg">
    <div class="slide" id="s0"></div><div class="slide" id="s1"></div>
    <div class="silk"></div><div class="shade"></div><div class="leak"></div>
    <div class="emblem"><i></i><i></i><i></i>
      <svg viewBox="0 0 64 56" fill="none" stroke="#f6dc8d" stroke-width="1.600" stroke-linejoin="round"><path d="M14 3h36l12 15-30 35L2 18 14 3z" fill="rgba(246,220,141,.14)"/><path d="M2 18h60M23 3l-9 15 18 35 18-35-9-15M23 3l9 15 9-15"/></svg>
    </div>
  </div>
  <div class="screen">
    <header>
      <div><h1 class="serif" id="shop">Nusky Jewellers</h1><p class="sub hide" id="sub"></p></div>
      <div class="time"><b><span id="hm"></span><small id="ap"></small></b><span id="date"></span></div>
    </header>
    <main>
      <div class="cards"><div class="unit" id="unit"></div><div id="cards"></div></div>
      <aside class="side"><ul class="points" id="points"></ul><div class="contact hide" id="contact"></div></aside>
    </main>
    <footer class="hide" id="ticker"><span class="tag">Offer</span><div class="run" id="run"></div></footer>
  </div>
  <div class="offline" id="offline">Reconnecting to the shop server</div>

  <script src="/js/tv-common.js"></script>
  <script>
    (function () {
      var T = window.TV;
      var el = function (id) { return document.getElementById(id); };
      var cards = {};
      var shown = {};
      var seen = {};

      T.clock(function (c) {
        el('hm').textContent = c.hh + ':' + c.mm;
        el('ap').textContent = c.ampm;
        el('date').textContent = c.day + ', ' + c.dom + ' ' + c.month + ' ' + c.year;
      });

      var show = T.slideshow(el('s0'), el('s1'), 12000, function (url) {
        document.body.className = url ? '' : 'noimg';
      }, function (index) { return index % 2 ? 'b' : 'a'; });

      function card(karat) {
        var box = T.make('div', 'card');
        var k = T.make('div', 'k', karat + 'K');
        k.appendChild(T.make('small', '', T.FINENESS[karat] || ''));
        var right = T.make('div', '');
        right.style.cssText = '-webkit-flex:1;flex:1;min-width:0';
        var p = T.make('div', 'p');
        var cur = T.make('i', '');
        var num = T.make('span', '', '—');
        p.appendChild(cur);
        p.appendChild(num);
        var b = T.make('div', 'b hide');
        right.appendChild(p);
        right.appendChild(b);
        box.appendChild(k);
        box.appendChild(right);
        el('cards').appendChild(box);
        cards[karat] = { box: box, cur: cur, num: num, b: b };
        return cards[karat];
      }

      function render(data) {
        var name = data.shop_name || 'Nusky Jewellers';
        el('shop').textContent = name;
        el('sub').textContent = data.subtitle || '';
        el('sub').className = data.subtitle ? 'sub' : 'sub hide';
        el('unit').textContent = 'Gold price, ' + T.unitLabel(data);
        for (var i = 0; i < data.rates.length; i++) {
          var r = data.rates[i];
          var c = cards[r.karat] || card(r.karat);
          var sell = T.unitValue(r.sell_rate, data);
          var buy = T.unitValue(r.buy_rate, data);
          c.cur.textContent = sell > 0 ? (data.currency || '') : '';
          c.b.textContent = 'We buy at ' + T.price(buy);
          c.b.className = data.show_buy && buy > 0 ? 'b' : 'b hide';
          if (shown[r.karat] !== sell) {
            T.roll(c.num, shown[r.karat] || 0, sell, 1600);
            shown[r.karat] = sell;
          }
        }
        var pts = JSON.stringify([data.points, data.phone]);
        if (seen.points !== pts) {
          seen.points = pts;
          var list = el('points');
          list.innerHTML = '';
          for (var n = 0; n < (data.points || []).length; n++) {
            var li = T.make('li', '');
            li.appendChild(T.make('b', '', data.points[n][0]));
            li.appendChild(document.createTextNode(data.points[n][1]));
            list.appendChild(li);
          }
          var contact = el('contact');
          contact.innerHTML = '';
          if (data.phone) {
            contact.appendChild(T.make('small', '', 'Call us'));
            contact.appendChild(document.createTextNode(data.phone));
          }
          contact.className = data.phone ? 'contact' : 'contact hide';
        }
        T.marquee(el('ticker'), el('run'), data.message || '', 16);
        show.set(T.imageUrls(data));
      }

      // Every few seconds a light travels down the cards.
      setInterval(function () {
        var list = el('cards').children;
        for (var i = 0; i < list.length; i++) {
          (function (node, delay) {
            setTimeout(function () { node.className = 'card lit'; }, delay);
            setTimeout(function () { node.className = 'card'; }, delay + 900);
          })(list[i], i * 350);
        }
      }, 9000);

      T.start(render, el('offline'), 'cinema');
    })();
  </script>
</body>
</html>
