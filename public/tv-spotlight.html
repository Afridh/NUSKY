<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gold price today</title>
  <link rel="icon" href="data:,">
  <!-- "Spotlight" TV design: one karat at a time, enormous, changing every few seconds, over a softly blurred photo. -->
  <style>
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #000; overflow: hidden; }
    body { font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; color: #fff; cursor: none; }
    .serif { font-family: Cinzel, Constantia, 'Palatino Linotype', 'Book Antiqua', Georgia, serif; }
    .hide { display: none !important; }

    .bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; background: radial-gradient(ellipse at 50% 40%, #2a1d06, #070503 70%); }
    .slide { position: absolute; top: -8%; left: -8%; width: 116%; height: 116%; background-size: cover; background-position: center; opacity: 0; transition: opacity 2.5s ease; filter: blur(18px) brightness(.45) saturate(1.2); }
    .slide.on { opacity: 1; animation: drift 14s ease-in-out infinite alternate; }
    .slide.out { opacity: 0; }
    @keyframes drift { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.08) translate(-2%, 2%); } }
    /* turning rays of light behind the price */
    .rays { position: absolute; left: 50%; top: 50%; width: 220vh; height: 220vh; margin: -110vh 0 0 -110vh; opacity: .55;
      background: conic-gradient(from 0deg, rgba(246, 220, 141, 0) 0deg 14deg, rgba(246, 220, 141, .14) 14deg 22deg, rgba(246, 220, 141, 0) 22deg 50deg, rgba(246, 220, 141, .1) 50deg 56deg, rgba(246, 220, 141, 0) 56deg 90deg, rgba(246, 220, 141, .14) 90deg 98deg, rgba(246, 220, 141, 0) 98deg 140deg, rgba(246, 220, 141, .1) 140deg 146deg, rgba(246, 220, 141, 0) 146deg 180deg, rgba(246, 220, 141, .14) 180deg 188deg, rgba(246, 220, 141, 0) 188deg 230deg, rgba(246, 220, 141, .1) 230deg 236deg, rgba(246, 220, 141, 0) 236deg 270deg, rgba(246, 220, 141, .14) 270deg 278deg, rgba(246, 220, 141, 0) 278deg 320deg, rgba(246, 220, 141, .1) 320deg 326deg, rgba(246, 220, 141, 0) 326deg 360deg);
      animation: turn 60s linear infinite; }
    @keyframes turn { to { transform: rotate(360deg); } }
    .vignette { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: radial-gradient(ellipse at 50% 45%, rgba(0, 0, 0, 0) 30%, rgba(0, 0, 0, .75) 85%); }

    .screen { position: relative; height: 100vh; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; padding: 2.6vh 3vw 2vh; }
    header { display: -webkit-flex; display: flex; -webkit-justify-content: space-between; justify-content: space-between; -webkit-align-items: center; align-items: center; animation: fadein 1s ease both; }
    h1 { margin: 0; font-size: 5.2vh; letter-spacing: .1em; text-transform: uppercase; color: #f6dc8d; }
    h1 small { display: block; font-size: 2.3vh; letter-spacing: .35em; color: #c9b98a; margin-top: .4vh; }
    .clock { font-size: 5.6vh; font-weight: 300; letter-spacing: .05em; }
    .clock small { font-size: 2.3vh; font-weight: 600; color: #e9c35a; margin-left: .5vw; }
    .clock span { display: block; font-size: 2.2vh; color: #c9b98a; letter-spacing: .15em; text-align: right; }

    .stage { -webkit-flex: 1; flex: 1; position: relative; min-height: 0; }
    .act { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: -webkit-flex; display: flex; -webkit-flex-direction: column; flex-direction: column; -webkit-align-items: center; align-items: center; -webkit-justify-content: center; justify-content: center; text-align: center; opacity: 0; pointer-events: none; }
    .act.in { animation: enter 1s cubic-bezier(.2, .8, .2, 1) both; opacity: 1; }
    .act.leave { animation: leave .7s cubic-bezier(.6, 0, .8, .4) both; }
    @keyframes enter { 0% { opacity: 0; transform: translateY(10vh) scale(.9); filter: blur(10px); } 100% { opacity: 1; transform: none; filter: blur(0); } }
    @keyframes leave { 0% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-9vh) scale(1.06); filter: blur(8px); } }
    .act .karat { display: inline-block; padding: 1vh 3vw .8vh; border-radius: 99vh; background: linear-gradient(100deg, #7a560f, #d9a93a 30%, #fff0ad 50%, #d9a93a 70%, #7a560f); color: #130c00; font-size: 6.5vh; font-weight: 800; letter-spacing: .04em; box-shadow: 0 1vh 4vh rgba(230, 187, 79, .35); }
    .act .karat small { font-weight: 700; font-size: .5em; margin-left: 1vw; opacity: .7; letter-spacing: .3em; }
    .act .label { margin-top: 3vh; font-size: 2.6vh; letter-spacing: .4em; text-transform: uppercase; color: #c9b98a; }
    .act .big { font-size: 22vh; font-weight: 800; line-height: 1; letter-spacing: -.01em; white-space: nowrap; color: #fff; text-shadow: 0 1vh 6vh rgba(0, 0, 0, .6); }
    .act .big i { font-style: normal; font-size: .38em; font-weight: 700; color: #f6dc8d; vertical-align: .55em; margin-right: 1vw; }
    .act .buy { margin-top: 1.5vh; font-size: 3.6vh; color: #e8dfc4; }
    .act .buy b { color: #f6dc8d; margin-left: .6vw; }
    @supports ((-webkit-background-clip: text) or (background-clip: text)) {
      .act .big span { background: linear-gradient(180deg, #fff 20%, #f6dc8d 60%, #c9952b); -webkit-background-clip: text; background-clip: text; color: transparent; }
    }

    .tabs { -webkit-flex: none; flex: none; display: -webkit-flex; display: flex; gap: 1vw; margin-top: 1vh; animation: fadein 1s ease .4s both; }
    .tab { position: relative; overflow: hidden; -webkit-flex: 1; flex: 1; padding: 1.4vh 1.4vw 1.6vh; border: 1px solid rgba(246, 220, 141, .35); border-radius: 1.4vh; background: rgba(0, 0, 0, .45); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; transition: background-color .5s, border-color .5s, transform .5s; }
    .tab.on { background: rgba(120, 88, 20, .5); border-color: #f6dc8d; transform: translateY(-.8vh); }
    .tab b { font-size: 4vh; font-weight: 800; color: #f6dc8d; }
    .tab b small { display: block; font-size: 1.7vh; letter-spacing: .4vh; color: #c9b98a; font-weight: 600; }
    .tab span { font-size: 3.6vh; font-weight: 700; }
    .tab i { position: absolute; left: 0; bottom: 0; height: .6vh; width: 0; background: linear-gradient(90deg, #c9952b, #fff0ad); }
    .tab.on i { animation: fill linear both; }
    @keyframes fill { from { width: 0; } to { width: 100%; } }

    footer { -webkit-flex: none; flex: none; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; -webkit-justify-content: space-between; justify-content: space-between; gap: 2vw; margin-top: 1.6vh; font-size: 2.3vh; letter-spacing: .1em; color: #d9cfb3; animation: fadein 1s ease .6s both; }
    .points span { margin-right: 1.4vw; text-transform: uppercase; }
    .points span:before { content: '\25C6'; color: #e9c35a; margin-right: .6vw; font-size: .8em; }
    .ticker { -webkit-flex: 1; flex: 1; min-width: 0; height: 5.4vh; display: -webkit-flex; display: flex; -webkit-align-items: center; align-items: center; border-radius: 99vh; overflow: hidden; background: linear-gradient(90deg, #7a560f, #e6bb4f 20%, #fff0ad 50%, #e6bb4f 80%, #7a560f); color: #140d00; font-weight: 800; font-size: 2.9vh; letter-spacing: 0; }
    .run { -webkit-flex: 1; flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; }
    .run div { display: inline-block; }
    .run span { display: inline-block; white-space: pre; }
    @keyframes tvmarquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .phone { font-size: 3.4vh; font-weight: 800; color: #fff; letter-spacing: .05em; white-space: nowrap; }
    @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
    .offline { position: fixed; right: 1vw; top: 1vh; font-size: 1.8vh; color: #c9b98a; display: none; }
    @media (prefers-reduced-motion: reduce) { *, *:before, *:after { animation: none !important; transition: none !important; } .act.in { opacity: 1; } .slide.on { opacity: 1; } }
  </style>
</head>
<body>
  <div class="bg"><div class="slide" id="s0"></div><div class="slide" id="s1"></div><div class="rays"></div><div class="vignette"></div></div>
  <div class="screen">
    <header>
      <h1 class="serif" id="shop">Nusky Jewellers<small id="sub"></small></h1>
      <div class="clock"><b id="hm"></b><small id="ap"></small><span id="date"></span></div>
    </header>
    <div class="stage" id="stage"></div>
    <div class="tabs" id="tabs"></div>
    <footer>
      <div class="points" id="points"></div>
      <div class="ticker hide" id="ticker"><div class="run" id="run"></div></div>
      <div class="phone" id="phone"></div>
    </footer>
  </div>
  <div class="offline" id="offline">Reconnecting to the shop server</div>

  <script src="/js/tv-common.js"></script>
  <script>
    (function () {
      var T = window.TV;
      var el = function (id) { return document.getElementById(id); };
      var EVERY = 6000;
      var acts = {};
      var tabs = {};
      var order = [];
      var current = -1;
      var data = null;
      var seen = {};

      T.clock(function (c) {
        el('hm').textContent = c.hh + ':' + c.mm;
        el('ap').textContent = c.ampm;
        el('date').textContent = c.day + ' ' + c.dom + ' ' + c.month;
      });
      var show = T.slideshow(el('s0'), el('s1'), 12000);

      function act(karat) {
        var a = T.make('div', 'act');
        var k = T.make('div', 'karat', karat + 'K');
        k.appendChild(T.make('small', '', T.FINENESS[karat] || ''));
        var label = T.make('div', 'label');
        var big = T.make('div', 'big');
        var cur = T.make('i', '');
        var num = T.make('span', '', '—');
        big.appendChild(cur);
        big.appendChild(num);
        var buy = T.make('div', 'buy hide');
        a.appendChild(k); a.appendChild(label); a.appendChild(big); a.appendChild(buy);
        el('stage').appendChild(a);
        var t = T.make('div', 'tab');
        var tb = T.make('b', '', karat + 'K');
        tb.appendChild(T.make('small', '', T.FINENESS[karat] || ''));
        var tv = T.make('span', '', '—');
        var bar = T.make('i', '');
        t.appendChild(tb); t.appendChild(tv); t.appendChild(bar);
        el('tabs').appendChild(t);
        acts[karat] = { box: a, label: label, cur: cur, num: num, buy: buy, shown: null };
        tabs[karat] = { box: t, value: tv, bar: bar };
        order.push(karat);
      }

      function spotlight(index) {
        if (!order.length) return;
        var prevK = order[current];
        current = index % order.length;
        var k = order[current];
        if (prevK !== undefined && prevK !== k) {
          acts[prevK].box.className = 'act leave';
          tabs[prevK].box.className = 'tab';
        }
        var a = acts[k].box;
        a.className = 'act';
        void a.offsetWidth;
        a.className = 'act in';
        var t = tabs[k].box;
        t.className = 'tab on';
        tabs[k].bar.style.animationDuration = EVERY + 'ms';
        tabs[k].bar.style.animation = 'none';
        void tabs[k].bar.offsetWidth;
        tabs[k].bar.style.animation = '';
      }

      function render(d) {
        data = d;
        el('shop').firstChild.textContent = d.shop_name || 'Nusky Jewellers';
        el('sub').textContent = d.subtitle || '';
        var started = order.length > 0;
        for (var i = 0; i < d.rates.length; i++) {
          var r = d.rates[i];
          if (!acts[r.karat]) act(r.karat);
          var a = acts[r.karat];
          var sell = T.unitValue(r.sell_rate, d);
          var buy = T.unitValue(r.buy_rate, d);
          a.label.textContent = 'We sell at, ' + T.unitLabel(d);
          a.cur.textContent = sell > 0 ? (d.currency || '') : '';
          if (a.shown !== sell) { T.roll(a.num, a.shown || 0, sell, 1400); a.shown = sell; }
          a.buy.innerHTML = '';
          a.buy.appendChild(document.createTextNode('We buy at'));
          a.buy.appendChild(T.make('b', '', T.price(buy)));
          a.buy.className = d.show_buy && buy > 0 ? 'buy' : 'buy hide';
          tabs[r.karat].value.textContent = T.price(sell);
        }
        if (!started && order.length) {
          spotlight(0);
          setInterval(function () { spotlight(current + 1); }, EVERY);
        }
        var pts = JSON.stringify(d.points);
        if (seen.points !== pts) {
          seen.points = pts;
          var box = el('points');
          box.innerHTML = '';
          for (var n = 0; n < (d.points || []).length && n < 3; n++) box.appendChild(T.make('span', '', d.points[n][0]));
        }
        el('phone').textContent = d.phone || '';
        T.marquee(el('ticker'), el('run'), d.message || '', 14);
        show.set(T.imageUrls(d));
      }

      T.start(render, el('offline'), 'spotlight');
    })();
  </script>
</body>
</html>
